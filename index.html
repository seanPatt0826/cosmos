<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Cosmos — a little universe, drawn by hand</title>

<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0818'/%3E%3Cpath d='M16 6.5c5.1 0 9.2 4.2 9.4 9.4.2 5.3-4.1 9.6-9.4 9.6-5.2 0-9.5-4.3-9.4-9.5.1-5.2 4.3-9.5 9.4-9.5z' fill='none' stroke='%23F2EADB' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M5 19.5c4.5 2.6 17 2.9 22-1' stroke='%23E8A33D' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shantell+Sans:ital,wght@0,300..700;1,300..600&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

<style>
  :root {
    color-scheme: dark;
    --void:    #07060F;
    --void-2:  #0C0A1A;
    --paper:   #F2EADB;
    --ink:     rgba(242, 234, 219, 0.62);
    --ink-dim: rgba(242, 234, 219, 0.34);
    --line:    rgba(242, 234, 219, 0.14);
    --accent:  #E8A33D;
    --panel-bg: rgba(13, 10, 27, 0.9);
    --edge: rgba(242, 234, 219, 0.3);
    --edge-soft: rgba(242, 234, 219, 0.1);
    --rail-w:  310px;
    --font: "Shantell Sans", "Comic Sans MS", "Segoe Print", cursive;
  }

  /* Light mode is a daytime sketchbook, not the dark theme turned up. The
     drawings themselves are unchanged — paper and graphite read correctly on
     either ground, which is the one lucky thing about this art direction. */
  body.light {
    --void:    #E9E4D6;
    --void-2:  #EFEADC;
    --paper:   #2E2934;
    --ink:     rgba(46, 41, 52, 0.78);
    --ink-dim: rgba(46, 41, 52, 0.45);
    --line:    rgba(46, 41, 52, 0.18);
    --accent:  #B06E14;
    --panel-bg: rgba(250, 246, 237, 0.94);
    --edge: rgba(46, 41, 52, 0.42);
    --edge-soft: rgba(46, 41, 52, 0.14);
    color-scheme: light;
  }
  body.light #banner { text-shadow: 0 0 26px rgba(255, 255, 255, 0.75); }
  body.light #controls button:hover { background: rgba(46, 41, 52, 0.09); }
  body.light .names button.ghost:hover { background: rgba(46, 41, 52, 0.08); }
  body.light #standings-list .row i { box-shadow: 0 0 0 1px rgba(46, 41, 52, 0.3) inset; }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--void);
    color: var(--ink);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    opacity: 0;
    transition: opacity 700ms ease;
  }
  body.ready { opacity: 1; }

  /* ── Frame ──────────────────────────────────────────────────────────── */

  /* The game is the page. No frame, no padding, no letterboxing — the canvas
     fills the window and everything else floats on top of it. */
  .console { height: 100%; width: 100%; }

  .stage-wrap {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: var(--void-2);
  }

  canvas#stage { display: block; width: 100%; height: 100%; }

  /* ── Rail ───────────────────────────────────────────────────────────── */

  .rail {
    position: absolute;
    top: 10px;
    right: 9px;
    width: var(--rail-w);
    max-height: calc(100% - 20px);
    display: flex;
    flex-direction: column;
    gap: 12px;
    /* Above the canvas, and clickable — the entrants box lives in here. */
    z-index: 3;
    /* The panels are tilted a fraction of a degree, which makes their boxes
       fractionally wider than the column. Per spec, setting overflow-y alone
       turns overflow-x from visible into auto, so that fraction was enough to
       put a horizontal scrollbar along the bottom of the sidebar. The padding
       gives the tilt and the offset shadow somewhere to sit. */
    padding: 4px 5px;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--edge-soft) transparent;
  }

  .rail::-webkit-scrollbar, #standings-list::-webkit-scrollbar, #name-list::-webkit-scrollbar {
    width: 6px;
  }
  .rail::-webkit-scrollbar-thumb, #standings-list::-webkit-scrollbar-thumb,
  #name-list::-webkit-scrollbar-thumb {
    background: var(--edge-soft);
    border-radius: 3px;
  }
  .rail::-webkit-scrollbar-track, #standings-list::-webkit-scrollbar-track,
  #name-list::-webkit-scrollbar-track { background: transparent; }

  /* No backdrop-filter anywhere in this file, deliberately. A blur that samples
     a live canvas behind it corrupted on the owner's machine — a band of smeared
     garbage across the row of the controls bar — and it is expensive besides.
     The panels are simply opaque enough to read instead. */

  /* Panels look drawn, not printed.

     Everything inside the arena is pencil and crayon, and the side column was
     the one place that still looked like generic dark glass. Two cheap tricks
     fix that without a single image: an asymmetric border-radius, which reads as
     a rounded box someone drew freehand, and a hard offset shadow that looks
     like the outline was gone over twice and slipped. A fraction of a degree of
     tilt finishes it — enough to feel placed by hand, not enough to look
     broken. */
  .panel {
    position: relative;
    /* Keep their natural height and let the rail scroll. As flex children they
       shrink by default, and once there were five of them that quietly
       squeezed the standings list down to nothing — the count stayed but the
       names under it were crushed to zero height. */
    flex-shrink: 0;
    background: var(--panel-bg);
    border: 1.5px solid var(--edge);
    border-radius: 17px 11px 19px 13px / 13px 19px 11px 17px;
    box-shadow: 2px 2.5px 0 var(--edge-soft);
  }
  .panel + .panel { border-radius: 12px 18px 12px 20px / 18px 12px 19px 12px; }
  .rail .panel:nth-child(1) { transform: rotate(-0.35deg); }
  .rail .panel:nth-child(2) { transform: rotate(0.3deg); }
  .rail .panel:nth-child(3) { transform: rotate(-0.22deg); }


  /* Wordmark and links, tucked into the far corner and out of the way. */
  .corner {
    position: absolute;
    left: 20px;
    bottom: 16px;
    z-index: 3;
  }
  .corner h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    color: var(--paper);
    opacity: 0.85;
  }
  .corner nav { display: flex; gap: 13px; font-size: 12.5px; margin-top: 1px; }
  .corner nav a { color: var(--ink-dim); text-decoration: none; }
  .corner nav a:hover { color: var(--paper); text-decoration: underline; }

  /* ── Entrants ───────────────────────────────────────────────────────── */

  .names { padding: 11px 12px 12px; }
  /* Same treatment as the standings heading, so the two panels read as a pair
     rather than one titled card and one unlabelled box. */
  .names label {
    display: block;
    font-size: 16px;
    font-weight: 600;
    color: var(--paper);
    padding-bottom: 7px;
    margin-bottom: 8px;
    border-bottom: 1.5px solid var(--edge-soft);
  }
  /* Two columns of boxes. Names are short, so a single column would waste half
     the width and push the list past the bottom of the screen. */
  #name-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 5px;
    max-height: 40vh;
    overflow-y: auto;
    padding-right: 2px;
    scrollbar-width: thin;
  }

  .name-row { position: relative; min-width: 0; }

  .name-row input {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    color: var(--paper);
    background: rgba(255, 255, 255, 0.045);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 5px 20px 5px 9px;
    transition: border-color 140ms ease, background 140ms ease;
  }
  body.light .name-row input { background: rgba(46, 41, 52, 0.05); }
  .name-row input:focus {
    outline: none;
    border-color: rgba(232, 163, 61, 0.6);
    background: rgba(232, 163, 61, 0.08);
  }
  .name-row input::placeholder { color: var(--ink-dim); opacity: 0.65; }

  /* The remove button only appears once there is something to remove, so eight
     empty boxes do not look like eight things to dismiss. */
  .name-del {
    position: absolute;
    right: 3px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    padding: 0;
    line-height: 1;
    font-size: 14px;
    border: none;
    border-radius: 50%;
    background: transparent;
    color: var(--ink-dim);
    cursor: pointer;
    opacity: 0;
    transition: opacity 140ms ease, color 140ms ease;
  }
  .name-row:hover .name-del,
  .name-row input:focus + .name-del { opacity: 1; }
  .name-del:hover { color: var(--accent); }

  .names-row { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
  .names button {
    font-family: inherit;
    font-size: 13px;
    padding: 5px 13px;
    border-radius: 999px;
    cursor: pointer;
    border: 1px solid rgba(232, 163, 61, 0.5);
    background: rgba(232, 163, 61, 0.14);
    color: var(--accent);
    transition: background 160ms ease;
  }
  .names button:hover { background: rgba(232, 163, 61, 0.26); }
  .names button.ghost {
    border-color: var(--line);
    background: transparent;
    color: var(--ink-dim);
  }
  .names button.ghost:hover { background: rgba(242, 234, 219, 0.08); color: var(--paper); }

  /* The way in for someone who has typed nothing. Full width and on its own
     line so it reads as an offer rather than a fourth control. */
  .names button.example {
    display: block;
    width: 100%;
    margin-top: 8px;
    padding: 8px 13px;
  }
  .names button.example[hidden] { display: none; }

  .names-hint { margin: 6px 0 0; font-size: 12px; color: var(--ink-dim); }

  /* ── Chase camera ───────────────────────────────────────────────────── */

  #chase-cam {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 282 / 176;
    margin-top: 8px;
    border-radius: 9px;
    border: 1px solid var(--line);
    /* The crop is a magnified bitmap, so it is soft by nature. On artwork that
       is already pencil and crayon that reads as depth of field rather than as
       a low-resolution mistake. */
    background: var(--void-2);
  }
  .chase-caption {
    margin: 6px 0 0;
    font-size: 12px;
    text-align: center;
    color: var(--ink-dim);
    min-height: 1.3em;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* ── Universe picker ────────────────────────────────────────────────── */

  .universe {
    display: block;
    width: 100%;
    padding: 0;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: transparent;
    color: var(--ink-dim);
    font-family: inherit;
    cursor: pointer;
    overflow: hidden;
    transition: border-color 160ms ease, color 160ms ease;
  }
  .universe:hover { border-color: rgba(232, 163, 61, 0.55); color: var(--paper); }
  .universe.active {
    border-color: var(--accent);
    color: var(--accent);
  }
  /* The portrait sits flush to the card's edges; the name is a caption under
     it rather than a label beside it. */

  /* ── HUD ────────────────────────────────────────────────────────────── */

  .hud {
    position: absolute;
    inset: 0;
    pointer-events: none;
    user-select: none;
  }

  #map-name {
    position: absolute;
    top: 16px;
    left: 20px;
    font-size: 19px;
    color: var(--ink);
  }
  #map-name.intro { animation: slideIn 900ms cubic-bezier(.2,.8,.3,1) both; }
  #map-blurb {
    position: absolute;
    top: 41px;
    left: 20px;
    font-size: 13px;
    font-style: italic;
    color: var(--ink-dim);
  }

  /* ── Standings ──────────────────────────────────────────────────────── */

  /* Now a block inside the rail rather than a floating panel of its own. */
  #standings {
    /* Was `0 1 auto` with min-height 0, which let it shrink away entirely:
       with five panels in the column the list collapsed to a single pixel and
       the count sat on top of nothing. The rail scrolls, so no panel needs to
       give up height for another. */
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    padding: 10px 12px 10px;
  }

  /* The count reads as a heading written at the top of a list, with a ruled
     line under it, rather than a table header. */
  #count {
    font-size: 16px;
    font-weight: 600;
    color: var(--paper);
    font-variant-numeric: tabular-nums;
    padding-bottom: 7px;
    margin-bottom: 6px;
    border-bottom: 1.5px solid var(--edge-soft);
  }

  #standings-list {
    list-style: none;
    margin: 0;
    padding: 0;
    scrollbar-color: var(--edge-soft) transparent;
    /* Scrolls rather than clips. Hidden overflow sliced the last row in half,
       which looked like a rendering fault rather than a full list. */
    overflow-y: auto;
    scrollbar-width: thin;
    font-size: 13px;
    /* A scroll container still slices whatever row straddles its edge. Fading
       the last few pixels turns that slice into "there is more below". */
    mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent);
    -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 16px), transparent);
  }
  #standings-list .row {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 1.5px 0;
    color: var(--ink);
    /* Names are user text and can be anything; never let one break the panel. */
    min-width: 0;
  }
  #standings-list .row span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  /* A blob of crayon rather than a legend dot: slightly off-round, with an ink
     ring around it, the way the objects themselves are drawn. */
  #standings-list .row i {
    flex: 0 0 11px;
    width: 11px;
    height: 11px;
    border-radius: 60% 40% 55% 45% / 45% 55% 40% 60%;
    box-shadow: 0 0 0 1.5px var(--edge-soft);
  }
  #standings-list .row.more { color: var(--ink-dim); font-style: italic; }
  #standings-list .row.more i { background: transparent; box-shadow: none; }
  #standings-list .row.win { color: var(--accent); font-weight: 600; }

  #banner {
    position: absolute;
    left: 0; right: 0;
    top: 50%;
    text-align: center;
    font-size: 62px;
    font-weight: 600;
    color: var(--paper);
    opacity: 0;
    transform: translateY(-50%) scale(0.94);
    transition: opacity 320ms ease, transform 420ms cubic-bezier(.2,.8,.3,1);
    text-shadow: 0 0 34px rgba(242, 234, 219, 0.28);
  }
  #banner.on { opacity: 1; transform: translateY(-50%) scale(1); }
  #banner.count-in { font-size: 90px; opacity: 0.32; }
  #banner.final { font-size: 46px; opacity: 0.72; letter-spacing: 0.04em; }
  /* Shifted off centre: the winner is framed dead centre by then, and a word
     printed across it hides the thing you are meant to be looking at. */
  #banner.winner { font-size: 62px; letter-spacing: 0.05em; top: 27%; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-14px); }
    to   { opacity: 1; transform: none; }
  }

  /* Press F to show it. Exists because "it feels laggy" and "it is running at
     41fps" are very different reports, and only the second one can be acted on. */
  #fps {
    position: absolute;
    left: 20px;
    top: 64px;
    font-size: 12.5px;
    color: var(--ink-dim);
    font-variant-numeric: tabular-nums;
    white-space: pre;
  }

  /* ── Controls ───────────────────────────────────────────────────────── */

  #controls {
    position: absolute;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 7px 9px;
    border-radius: 999px;
    background: var(--panel-bg);
    border: 1px solid var(--line);
    pointer-events: auto;
    transition: opacity 520ms ease, transform 520ms ease;
    max-width: calc(100% - 32px);
  }
  #controls.hidden { opacity: 0; transform: translateX(-50%) translateY(9px); pointer-events: none; }

  #controls button {
    font-family: inherit;
    font-size: 13px;
    color: var(--ink);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 4px 11px;
    cursor: pointer;
    transition: background 160ms ease, color 160ms ease, border-color 160ms ease;
    white-space: nowrap;
  }
  #controls button:hover { background: rgba(242, 234, 219, 0.09); color: var(--paper); }
  #controls button.active { border-color: rgba(232, 163, 61, 0.5); color: var(--accent); }

  #map-picker { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }
  .divider { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }

  /* ── Transition ─────────────────────────────────────────────────────── */

  #fade {
    position: absolute;
    inset: 0;
    background: var(--void);
    opacity: 0;
    pointer-events: none;
    transition: opacity 480ms ease;
  }
  #fade.on { opacity: 1; }

  /* ── Narrow ─────────────────────────────────────────────────────────── */

  /* On a phone a 300px column would eat half the arena, so the rail becomes a
     narrow strip and the entrants box collapses to a tap-to-open panel. The
     stage still fills the screen behind it. */
  @media (max-width: 900px) {
    .rail {
      width: min(260px, 46vw);
      top: 10px;
      right: 10px;
      gap: 9px;
    }
    /* Narrow column: keep the headline and the link, drop the paragraph. */
    /* One column: two name boxes side by side inside a 44vw rail is unusable. */
    #name-list { grid-template-columns: 1fr; max-height: 30vh; }
    .corner h1 { font-size: 17px; }
    /* Keep the list short so the entrants box stays on screen. */
    #standings-list { font-size: 12px; max-height: 132px; overflow-y: auto; }
  }

  @media (max-width: 560px) {
    .rail { width: 44vw; }
    .names label, .names-hint { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    #banner, #fade, #map-name.intro { transition: none; animation: none; }
  }
</style>
</head>
<body>

<div class="console">
  <div class="stage-wrap">
    <canvas id="stage"></canvas>

    <aside class="rail">

      <div id="standings" class="panel">
        <div id="count"></div>
        <ul id="standings-list"></ul>
      </div>

      <section class="chase panel">
        <label>Close-up</label>
        <canvas id="chase-cam" width="282" height="176"></canvas>
        <p class="chase-caption" id="chase-caption"></p>
      </section>

      <section class="names panel">
        <label>Entrants</label>
        <div id="name-list"></div>
        <div class="names-row">
          <button type="button" id="btn-names">Race these</button>
          <button type="button" id="btn-add" class="ghost">+ Add</button>
          <button type="button" id="btn-names-clear" class="ghost">Clear</button>
        </div>
        <button type="button" id="btn-example" class="example">Watch an example</button>
        <p class="names-hint" id="names-hint">Add names, or watch an example.</p>
      </section>

    </aside>

    <div class="corner">
      <h1>Cosmos</h1>
      <nav><a href="./about.html">about</a><a href="./privacy.html">privacy</a></nav>
    </div>

    <div class="hud">
      <div id="map-name"></div>
      <div id="map-blurb"></div>
      <div id="banner"></div>
      <div id="fps" hidden></div>

      <div id="controls">
        <div id="map-picker"></div>
        <span class="divider"></span>
        <button type="button" id="btn-play">pause</button>
        <button type="button" id="btn-speed">1×</button>
        <button type="button" id="btn-mute">sound off</button>
        <button type="button" id="btn-theme">light</button>
        <button type="button" id="btn-skip">skip</button>
      </div>
    </div>

    <div id="fade"></div>
  </div>

</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
